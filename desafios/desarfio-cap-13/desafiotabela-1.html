<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio de espancao de tabela</title>
    <style>
        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        table {
            width: 600px;


        }

        td {
            text-align: center;
            border: 3px solid black;
            padding: 15px;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td colspan="4">A</td>

            <td rowspan="5">B</td>
        </tr>

        <tr>

            <td rowspan="5">C</td>

        </tr>
        <tr>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>

        <tr>

            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>

        <tr>
            <td colspan="4">N</td>


        </tr>

    </table>

</body>

</html>
