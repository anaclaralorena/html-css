<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagemk de Celulas</title>
</head>
<style>
    body {
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;

    }

    table {
        border-collapse: collapse;
        width: 400px;

    }

    td {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
    }
</style>
</head>

<body>
    <h1>Mesclagem de Colunas</h1>
    <table>
        <tr>
            <td colspan="">A</td>
           <td>B</td>
            <td colspan="">C</td>
        </tr>
        <tr>
             <td rowspan="">D</td>
            <td >E</td>
            <td colspan="">F</td>
         
        </tr>
        <tr>
            
            <td rowspan="">I</td>
        </tr>
        <tr>
           <td>J</td>
            <td >L</td>
            <td>M</td>
        </tr>
    </table>



</body>

</html>
