<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela </title>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif
        }
        caption{
            font-weight: bolder;
            padding: 10px;
            border:3px solid rgb(20, 39, 63)
        }

        table {
            text-align: center;
            border-collapse: collapse;
        }

       th ,td {
            width: 500px;
            padding: 5px;
            border: 1px solid black;
        }
    </style>
</head>


<body>

    <table>
        <caption>Filmes Favoridos  </caption>
        <thead>
            <tr>
              <th scope="col">Grupos</th>
              <th scope="col">Nomes</th>
              <th colspan="3" scope="colgroup">Filmes</th>
            </tr>



          

    </thead>
    <tr>
        <th rowspan="3" scope="rowgroup">Mulheres </th>
        <td>Ana Maria Sants</td>
        <td>Alien</td>
        <td>Rambo</td>
        <td>Vingadores</td>
    </tr>
    <tr>
        <td>Beatriz Solza</td>
        <td>Hulk</td>
        <td>Inception</td>
        <td>Batman</td>
    </tr>
    <tr>
        <td>Claudia Melo</td>
        <td>Oblivion</td>
        <td>Matrix</td>
        <td>Big Hero</td>
    </tr>
<tr>
  
  <th rowspan="3" scope="rowgroup">Homens</th>
        <td>Bruno Mendonca</td>
        <td>Intocaveis</td>
        <td>Amnesia</td>
        <td>Gladiador</td>
    </tr>
    <tr>
        <td>Dniel Lourenco</td>
        <td>Wall-E</td>
        <td>Oldboy</td>
        <td>Dangal</td>
    </tr>
<tr>
        <td>Fabiano Mota</td>
        <td>Star Wars 5</td>
        <td>tTaxi Driver</td>
        <td>Toy Story</td>
    </tr>





     <tbody>

    </tbody>
      
    </table>

</body>

</html>
